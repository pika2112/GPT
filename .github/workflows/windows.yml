name: Build and test Windows 10-11 app
on:
  push:
    branches: [main]
    paths-ignore: ['downloads/**', '*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:folder
      - name: Launch the real Windows desktop and test calls
        shell: pwsh
        run: |
          $env:CHAMADAS_SMOKE_DATA = Join-Path $env:RUNNER_TEMP 'chamadas-smoke'
          $appExe = Resolve-Path 'dist/win-unpacked/Sistema de Chamadas.exe'
          $proc = Start-Process -FilePath $appExe -ArgumentList '--smoke-test' -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(90000)) { Stop-Process -Id $proc.Id -Force; throw 'Desktop startup timed out' }
          $startupLog = Join-Path $env:CHAMADAS_SMOKE_DATA 'arranque.log'
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if ($proc.ExitCode -ne 0) { throw "Desktop exit code $($proc.ExitCode)" }
          if (-not (Select-String -Path $startupLog -Pattern 'SMOKE TEST PASSED' -Quiet)) { throw 'Desktop test did not complete' }
      - name: Generate the updated installation manual
        run: npx --no-install electron scripts/manual-pdf.js
      - name: Package the folder distribution
        shell: pwsh
        run: |
          $packageRoot = 'release/FarmaciaFaria'
          New-Item -ItemType Directory -Force "$packageRoot/Manuais" | Out-Null
          Copy-Item -Recurse dist/win-unpacked "$packageRoot/Chamadas"
          Copy-Item scripts/Iniciar.cmd "$packageRoot/Chamadas/Iniciar.cmd"
          Copy-Item START-HERE.txt "$packageRoot/LEIA-PRIMEIRO.txt"
          Copy-Item ATUALIZAR.txt "$packageRoot/ATUALIZAR.txt"
          Copy-Item INSTALACAO.txt "$packageRoot/Manuais/INSTALACAO.txt"
          Copy-Item TESTE-FINAL.txt "$packageRoot/Manuais/TESTE-FINAL.txt"
          Copy-Item docs/Manual-Farmacia-Faria-2.2.1.pdf "$packageRoot/Manuais/Manual-Farmacia-Faria-2.2.1.pdf"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'Farmacia-Faria-2.2.1-Windows10-11.zip'
          Push-Location release
          try {
            7z a -tzip -mx=3 $zipPath ./FarmaciaFaria
            if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }
          } finally { Pop-Location }
          # Inspect the final archive, including every runtime file.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($file in Get-ChildItem release -Recurse -File) {
              $relative = [System.IO.Path]::GetRelativePath((Resolve-Path release).Path, $file.FullName).Replace('\','/')
              if ($relative -notin $names) { throw "File missing from ZIP: $relative" }
            }
            foreach ($required in @('Chamadas/Iniciar.cmd','Chamadas/Sistema de Chamadas.exe','Chamadas/resources/app.asar','Manuais/Manual-Farmacia-Faria-2.2.1.pdf','Manuais/INSTALACAO.txt','Manuais/TESTE-FINAL.txt','LEIA-PRIMEIRO.txt','ATUALIZAR.txt')) {
              if ("FarmaciaFaria/$required" -notin $names) { throw "ZIP layout incorrect: $required" }
            }
            if ($names | Where-Object { $_ -match '(^|/)dados/|(^|/)chamadas\.json$' }) { throw 'User data must not be shipped in the application ZIP' }
            Write-Output "ZIP LAYOUT PASSED: $($archive.Entries.Count) entries, all runtime files and manuals present."
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-startup-log
          path: ${{ runner.temp }}/chamadas-smoke/arranque.log
        if: always()
      - name: Publish the tested download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v2.2.1-win10-11 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v2.2.1-win10-11 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Farmácia Faria 2.2.1 — pacote organizado' --notes 'ZIP organizado: FarmaciaFaria/Chamadas contém a aplicação completa; FarmaciaFaria/Manuais contém o PDF e os guias. LEIA-PRIMEIRO.txt e ATUALIZAR.txt estão na raiz. Para atualizar: exportar cópia JSON, sair pelo ícone junto ao relógio e substituir apenas a pasta do programa. Preserva histórico, nomes e funções por IP em AppData. Windows 10/11 de 64 bits. Executável e estrutura do ZIP verificados automaticamente.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload v2.2.1-win10-11 Farmacia-Faria-2.2.1-Windows10-11.zip docs/Manual-Farmacia-Faria-2.2.1.pdf --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
